<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10934F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Compra">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Menú de la semana y lista de la compra para Mercadona, dentro de tu presupuesto y sin tirar comida.">
<title>Mi Compra Inteligente</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: columna móvil de 560px máx · cabecera fija con el estado de la cesta · contenido por pestañas · navegación inferior fija */
:root{
  /* Tema único, claro y vivo (a petición: nada de fondos negros, aunque el móvil esté en modo oscuro) */
  --bg:#F4FBF6; --surface:#FFFFFF; --ink:#16352A; --muted:#5B7367; --line:#D5EADC;
  --green:#10934F; --green-strong:#0A7440; --green-soft:#DCF4E5; --on-green:#FFFFFF; --leaf:#FFB627; --plate-bg:#E8F6EC;
  --head:linear-gradient(120deg,#0E8A4A 0%,#13A55C 60%,#22B86E 100%);
  --table:#EAF5EC; --table-line:rgba(16,147,79,.05); --warn:#A35F00; --warn-soft:#FFF1D6; --bad:#C62A1F; --bad-soft:#FFE7E3;
  --shadow:0 1px 2px rgba(16,60,35,.06),0 6px 20px rgba(16,60,35,.07);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabecera */
header.top{background:var(--head);color:var(--on-green)}
header.top .wrap{padding-block:8px 2px;display:grid;gap:6px}
.statusbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--on-green);box-shadow:0 6px 14px -10px rgba(10,30,18,.45)}
.statusbar .wrap{padding-block:4px 9px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .mark{width:28px;height:28px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:16px;white-space:nowrap;letter-spacing:-.01em;margin:0;line-height:1.1}
.tagline{margin:2px 0 0;font-size:12.5px;opacity:.9}
.store-link{font-size:12px;font-weight:600;color:var(--green);text-decoration:none;white-space:nowrap}
.store-link:hover{text-decoration:underline}
.store-card{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
a.btn{text-decoration:none}
.gear{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;flex:none}
.gear:hover,.gear[aria-current="page"]{background:rgba(255,255,255,.3)}
.volver{justify-self:start;border:0;background:none;color:var(--green-strong);font-weight:700;font-size:15px;padding:4px 0;display:flex;align-items:center;gap:4px}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.accion{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;min-height:58px;cursor:pointer}
.accion:hover{border-color:var(--green);background:var(--green-soft)}
.accion .ae{font-size:24px;line-height:1}
.accion b{font-size:14px;line-height:1.15;display:block}
.accion small{color:var(--muted);font-size:12px}
.demo-tag{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid currentColor;opacity:.9;white-space:nowrap}
.status{display:grid;gap:5px}
.st-main{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st-total{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.st-total strong{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1}
.st-total span{font-size:13px;opacity:.9}
.st-side{display:grid;justify-items:end;font-size:12px;line-height:1.25;text-align:right;min-width:0}
.st-side b{font-size:13px}
.status-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.status-row strong{font-family:var(--f-display);font-size:22px;font-weight:700}
.meter{height:6px;border-radius:99px;background:color-mix(in srgb,var(--on-green) 25%,transparent);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--on-green);transition:width .35s ease}
.meter.over i{background:var(--warn-soft)}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:18px 24px;display:grid;gap:18px}
section[data-view]{display:grid;gap:16px}
.view-head h2{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.view-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--green);color:var(--on-green);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--green-strong)}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--green-soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--green-soft);color:var(--green-strong);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}

.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}
.notice b{color:var(--warn)}

/* Menú */
.day{display:grid;gap:8px}
.day-name{font-family:var(--f-display);font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:4px;min-width:0}
.slot:hover{border-color:var(--green)}
.slot .label{font-size:10px}
.slot .name{font-weight:600;line-height:1.25}
.slot .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.slot.flag{border-color:var(--bad)}

/* Lista */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sec{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;background:var(--green-soft);font-weight:700;font-size:14px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.sec-head + .item{border-top:0}
.item input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--green)}
.item .name{font-weight:600}
.item .detail{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.item .price{text-align:right;font-weight:700}
.item .price small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.item.done .name{text-decoration:line-through;color:var(--muted)}
.covered{font-size:13px}
.covered summary{cursor:pointer;font-weight:600;color:var(--green-strong)}
.covered ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.total-bar{display:flex;justify-content:space-between;align-items:baseline;padding:14px;border-radius:14px;background:var(--green);color:var(--on-green)}
.total-bar strong{font-family:var(--f-display);font-size:26px}

/* Presupuesto */
.big{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1}
.gauge{height:14px;border-radius:99px;background:var(--green-soft);overflow:hidden;position:relative}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:99px;transition:width .35s}
.gauge.over i{background:var(--bad)}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar-row .track{height:10px;border-radius:99px;background:var(--green-soft);overflow:hidden}
.bar-row .track i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg{display:grid;gap:8px}
.sugg-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sugg-item:first-child{border-top:0}
.sugg-item .swap{font-size:14px}
.sugg-item .swap s{color:var(--muted)}

/* Formularios */
.field{display:grid;gap:6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:42px;height:40px;font-size:20px;color:var(--green)}
.stepper button:hover{background:var(--green-soft)}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-size:17px}
input[type=range]{width:100%;accent-color:var(--green)}
input[type=number],select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle input{width:20px;height:20px;accent-color:var(--green)}

.pantry-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pantry-item:first-child{border-top:0}
.qty-in{display:flex;align-items:center;gap:6px}
.qty-in input{width:84px;text-align:right}
.icon-btn{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.icon-btn:hover{background:var(--bad-soft);color:var(--bad)}
.add-row{display:grid;grid-template-columns:1fr 96px auto;gap:8px}


.thumb{width:48px;height:48px;flex:none;border-radius:12px;background:var(--plate-bg);display:grid;place-items:center}
.thumb svg,.thumb img.dish{width:44px;height:44px}
.thumb.lg{width:64px;height:64px;border-radius:14px}.thumb.lg svg,.thumb.lg img.dish{width:58px;height:58px}
.thumb.xl{width:100%;height:190px;border-radius:16px;background:repeating-linear-gradient(90deg,var(--table-line) 0 2px,transparent 2px 6px),repeating-linear-gradient(0deg,var(--table-line) 0 2px,transparent 2px 6px),var(--table)}.thumb.xl svg,.thumb.xl img.dish{width:170px;height:170px}
.slot{grid-template-columns:auto 1fr;align-items:center;column-gap:10px}
.slot .txt{display:grid;gap:3px;min-width:0}
.today{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.today-dish{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:transparent;border:0;padding:0;width:100%}
.today-dish .name{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2}
.chev{color:var(--green);font-size:22px}
.guide{display:grid;gap:10px;background:var(--green-soft);border-radius:16px;padding:14px}
.guide ol{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:g}
.guide li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;counter-increment:g}
.guide li::before{content:counter(g);width:28px;height:28px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-weight:700;font-size:14px}
.guide li b{display:block}
.alt{grid-template-columns:auto 1fr auto}

/* Navegación inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.bottom button{border:0;background:transparent;padding:9px 2px 10px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--green)}
nav.bottom button[aria-current="page"] svg{stroke-width:2.3}

/* Hoja (modal) */
.sheet-back{position:fixed;inset:0;z-index:20;background:rgba(8,20,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;box-shadow:var(--shadow)}
.sheet h3{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:-.01em}
.ing-list{margin:0;padding:0;list-style:none;display:grid}
.ing-list li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ing-list li:first-child{border-top:0}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.alt-list{display:grid;gap:6px}
.alt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.alt:hover{border-color:var(--green)}
.alt.current{border-color:var(--green);background:var(--green-soft)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--green-strong);color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(10,80,40,.25);font-size:14px;font-weight:600;z-index:30;box-shadow:var(--shadow)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.slots{grid-template-columns:1fr}.bar-row{grid-template-columns:minmax(0,7em) 1fr auto}}

/* ===== v2 visual ===== */
.btn.xl{padding:16px 18px;font-size:17px;border-radius:14px}
.sr{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.bigq{display:grid;gap:14px;justify-items:center;text-align:center;padding:18px}
.q-title{display:grid;gap:4px;justify-items:center;font-family:var(--f-display);font-weight:700;font-size:18px}
.q-emo{font-size:34px;line-height:1}
.people{font-size:26px;letter-spacing:2px;min-height:32px;line-height:1.2}
.bigstep{display:flex;align-items:center;gap:18px}
.bigstep button{width:56px;height:56px;border-radius:50%;border:0;background:var(--green-soft);color:var(--green-strong);font-size:28px;font-weight:700}
.bigstep button:hover{background:var(--green);color:var(--on-green)}
.bigstep output{font-family:var(--f-display);font-size:40px;font-weight:800;min-width:48px}
.presu-big{display:flex;align-items:baseline;gap:4px;font-family:var(--f-display);font-weight:800;font-size:40px}
.presu-big input{width:3.4em;font:inherit;text-align:right;border:0;border-bottom:2px dashed var(--line);border-radius:0;background:transparent;padding:0}
.bigq input[type=range]{height:28px}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;width:100%}
.tiles.two{grid-template-columns:1fr 1fr}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;display:grid;justify-items:center;gap:6px;font-weight:600;font-size:13px}
.tile .t-emo{font-size:30px;line-height:1}
.tile[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green-strong)}


.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 2px 8px;display:grid;justify-items:center;gap:3px;min-width:0}
.wk[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.wkd{font-weight:700;font-size:12px}
.wkpic{width:34px;height:34px;border-radius:50%;background:var(--plate-bg);display:grid;place-items:center;overflow:hidden}
.wkpic svg,.wkpic img.dish{width:34px;height:34px}
.hoy{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--leaf);color:#3A2600;font-size:9px;font-weight:800;text-transform:uppercase;padding:1px 6px;border-radius:99px}
.dayttl{font-family:var(--f-display);font-size:22px;margin:0}
.bigcards{display:grid;gap:14px}
.bigcard{display:grid;border:1px solid var(--line);background:var(--surface);border-radius:20px;overflow:hidden;padding:0;text-align:left;box-shadow:var(--shadow)}
.bigcard:hover{border-color:var(--green)}
.bigcard.flag{border:2px solid var(--bad)}
.bigpic{position:relative;height:200px;background:repeating-linear-gradient(90deg,var(--table-line) 0 2px,transparent 2px 6px),repeating-linear-gradient(0deg,var(--table-line) 0 2px,transparent 2px 6px),var(--table);display:grid;place-items:center}
.bigpic svg,.bigpic img.dish{width:180px;height:180px}
.bigpic .plus{font-size:56px;color:var(--green)}
.badge{position:absolute;top:12px;left:12px;background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px;box-shadow:var(--shadow)}
.bigtxt{display:grid;gap:6px;padding:14px 16px 16px}
.bigtxt .name{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2}
.bigtxt .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;font-weight:500}
.ingemo{font-size:22px;letter-spacing:3px}

.progress{display:grid;gap:10px}
.progress a.btn{text-decoration:none}
.prod{position:relative;width:48px;height:48px;border-radius:14px;background:var(--plate-bg);display:grid;place-items:center;font-size:28px;flex:none}
.prod.sm{width:40px;height:40px;font-size:22px;border-radius:12px}
.prod .tick{position:absolute;inset:0;border-radius:14px;background:color-mix(in srgb,var(--green) 85%,transparent);color:var(--on-green);font-size:26px;font-weight:800;display:none;place-items:center}
.item{grid-template-columns:auto 1fr auto;align-items:center;cursor:pointer}
.item.done .prod .tick{display:grid}
.item.done{background:color-mix(in srgb,var(--green-soft) 50%,transparent)}
.item:has(.sr:focus-visible){outline:2px solid var(--green);outline-offset:-2px}
.qtybig{font-weight:700;color:var(--green-strong);font-size:14px}
.qtybig span{font-weight:500;color:var(--muted);font-size:12.5px}
.sec-head{font-size:15px}

/* ================= Formato ================= */
const eur = n => n.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const r2 = n => Math.round(n*100)/100;
function fmtQty(q,p){
  q=r2(q);
  if(p.unidad==='g') return q>=1000 ? `${(q/1000).toLocaleString('es-ES',{maximumFractionDigits:2})} kg` : `${Math.round(q)} g`;
  if(p.unidad==='ml') return q>=1000 ? `${(q/1000).toLocaleString('es-ES',{maximumFractionDigits:2})} l` : `${Math.round(q)} ml`;
  return `${q.toLocaleString('es-ES',{maximumFractionDigits:2})} ${p.ud||'ud'}`;
}
function precioUnit(p){
  if(p.unidad==='g') return `${eur(p.precio/p.envase*1000)}/kg`;
  if(p.unidad==='ml') return `${eur(p.precio/p.envase*1000)}/l`;
  return `${eur(p.precio/p.envase)}/ud`;
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= Motor de cálculo ================= */
function alergenosReceta(r){ return [...new Set(r.ing.flatMap(([pid])=>PROD[pid].alergenos||[]))]; }
function esVegetariana(r){ return r.ing.every(([pid])=>!PROD[pid].tipo); }
function costeRacion(r){ return r.ing.reduce((s,[pid,q])=>s+q/PROD[pid].envase*PROD[pid].precio,0); }
function compatible(r,h=state.hogar){
  if(h.vegetariano && !esVegetariana(r)) return false;
  if(alergenosReceta(r).some(a=>h.alergias.includes(a))) return false;
  return true;
}

// Frescos: lo que sobra se estropea en pocos días. El resto (seco, latas, congelado, aceite,
// huevos, embutido curado...) se guarda y pasa a la despensa para la semana siguiente.
const CORTA = new Set(['pechuga','muslos','picada','lomo','pavo','salchichas','hamburguesas','solomillo','entrecot','salmon','langostinos',
  'tomate','calabacin','pimiento','lechuga','pepino','champi','berenjena','pan','nata','mozzarella','jamon','bacon','york','calabaza','puerro','aguacate','cherry','rucula','alitas','dorada','quesofresco',
  'ternera','costillas','cordero','picadavacuno','pollo','sardinas','boquerones','mejillones','lubina','setas','esparragos','espinacafresca','canonigos','cilantro','cebolleta','salmonahumado','fresas']);
const perecedero = p => CORTA.has(p.id);
const opcionesDe = p => [{formato:p.formato, envase:p.envase, precio:p.precio}, ...(ALT[p.id]||[])];

function mejorCompra(p,q){
  if(q<=1e-9) return {partes:[],cant:0,coste:0,score:0};
  const ops=opcionesDe(p), fresco=perecedero(p);
  let best=null;
  const prueba=partes=>{
    partes=partes.filter(x=>x.n>0);
    const cant=partes.reduce((s,x)=>s+x.n*x.o.envase,0), coste=partes.reduce((s,x)=>s+x.n*x.o.precio,0);
    // El desperdicio de un fresco cuenta como dinero perdido (penalización); lo que se guarda no.
    const tirado = fresco ? (cant-q)*coste/cant : 0;
    const score = coste + tirado + (partes.length-1)*0.01;
    if(!best||score<best.score-1e-9) best={partes,cant,coste:r2(coste),score};
  };
  for(const a of ops){
    prueba([{o:a,n:Math.ceil(q/a.envase-1e-9)}]);
    const k=Math.floor(q/a.envase+1e-9), resto=q-k*a.envase;
    if(k>0&&resto>1e-9) for(const b of ops) if(b!==a) prueba([{o:a,n:k},{o:b,n:Math.ceil(resto/b.envase-1e-9)}]);
  }
  return best;
}
// Cómo se dice cada compra: "2 × Bandeja 500 g", "A granel · 2,4 kg (unas 12)", "3 sueltos".
// Lo que se coge a granel se suma en una sola cantidad aunque venga de dos formatos.
function partesCompra(partes,p){
  const esGranel=x=>x.o.granel||/^a granel/i.test(x.o.formato);
  const out=[], gr=partes.filter(esGranel);
  for(const x of partes.filter(x=>!esGranel(x))) out.push({n:x.n+' ×', txt:x.o.formato});
  if(gr.length){
    if(p.unidad==='ud'){ const n=gr.reduce((s,x)=>s+x.n*x.o.envase,0); out.push({n:String(n), txt:n===1?'suelto':'sueltos'}); }
    else {
      const cant=gr.reduce((s,x)=>s+x.n*x.o.envase,0);
      const piezas=gr.filter(x=>/pieza/.test(x.o.formato)).reduce((s,x)=>s+x.n,0);
      const pz=piezas&&gr.every(x=>/pieza/.test(x.o.formato))?(piezas===1?' (1 pieza)':` (unas ${piezas})`):'';
      out.push({n:'', txt:`A granel · ${fmtQty(cant,p)}${pz}`});
    }
  }
  return out;
}
const fmtPartes = (partes,p) => partesCompra(partes,p).map(f=>(f.n?f.n+' ':'')+f.txt).join(' + ');

// 1) Suma ingredientes repetidos y escala al número de comensales
// 2) Descuenta la despensa  3) Elige el formato que menos desperdicia  4) Separa lo que sobra:
//    frescos que se tirarían (desperdicio) y productos que se guardan para la semana siguiente
// Qué hace cada sobra en el plato de aprovechamiento y cuánto se mete como máximo por ración
const PAPEL_APROV = {
  pechuga:['prot',150], muslos:['prot',200], picada:['prot',120], lomo:['prot',120], pavo:['prot',120], salchichas:['prot',120],
  hamburguesas:['prot',1], solomillo:['prot',120], entrecot:['prot',150], salmon:['prot',120], langostinos:['prot',100], jamon:['prot',40],
  calabacin:['veg',150], pimiento:['veg',0.5], champi:['veg',100], berenjena:['veg',0.5], tomate:['veg',120], nata:['veg',50], mozzarella:['veg',40],
  lechuga:['ens',0.3], pepino:['ens',0.3],
  pan:['pan',0.5], bacon:['prot',40], york:['prot',60], calabaza:['veg',150], puerro:['veg',0.5], cherry:['veg',80], rucula:['ens',30], alitas:['prot',150],
};
const CORTO = {pechuga:'pollo', muslos:'pollo', picada:'carne picada', lomo:'lomo', pavo:'pavo', salchichas:'salchichas', hamburguesas:'hamburguesa',
  solomillo:'solomillo', entrecot:'entrecot', salmon:'salmón', langostinos:'langostinos', jamon:'jamón', calabacin:'calabacín', pimiento:'pimiento',
  champi:'champiñón', berenjena:'berenjena', tomate:'tomate', nata:'nata', mozzarella:'mozzarella', lechuga:'lechuga', pepino:'pepino', pan:'pan', bacon:'bacon', york:'jamón york', calabaza:'calabaza', puerro:'puerro', cherry:'tomate cherry', rucula:'rúcula', alitas:'alitas'};
function calcularCesta(menu=state.menu, h=state.hogar, despensa=state.despensa){
  const necesario={}, usos={};
  const add=(pid,q,nombre)=>{ necesario[pid]=(necesario[pid]||0)+q; (usos[pid]||(usos[pid]=new Set())).add(nombre); };
  let huecosAprov=0;
  menu.forEach((d,i)=>{ if(enCompra(i)) MOMENTOS.forEach(m=>{
    const r=REC[d[m]]; if(!r) return;
    if(r.aprov){ huecosAprov++; return; }
    r.ing.forEach(([pid,q])=>add(pid,q*h.personas,r.nombre));
  }); });
  // Cosas sueltas que añades tú (aguacates, fruta, limpieza…): se compran siempre, aunque tengas en casa
  const extra={};
  for(const [pid,n] of Object.entries(state.extras||{})) if(n>0&&PROD[pid]){ extra[pid]=n*PROD[pid].envase; if(!(pid in necesario)) necesario[pid]=0; (usos[pid]||(usos[pid]=new Set())).add('Añadido por ti'); }
  const lineaDe=(pid)=>{
    const p=PROD[pid], nec=r2(necesario[pid]||0), ext=extra[pid]||0;
    const enCasa=Math.min(despensa[pid]||0,nec), comprar=r2(nec-enCasa+ext);
    const mc=mejorCompra(p,comprar), sin=mejorCompra(p,nec+ext);
    return {pid,p,nec,enCasa,comprar,extra:ext?state.extras[pid]:0,envases:mc.partes.reduce((s,x)=>s+x.n,0),partes:mc.partes,coste:mc.coste,costeSin:sin.coste,
            sobra:r2(mc.cant-comprar),fresco:perecedero(p),cant:mc.cant,usos:[...usos[pid]]};
  };
  let lineas=Object.keys(necesario).map(lineaDe);
  // Fase 2: el plato de aprovechamiento se come los frescos que sobran
  const necRecetas={...necesario};   // antes de añadir la base del plato de aprovechamiento
  let aprov=null;
  if(huecosAprov){
    const raciones=h.personas*huecosAprov, comido=[];
    for(const l of lineas){
      const papel=PAPEL_APROV[l.pid];
      if(!l.fresco||l.sobra<=0||!papel) continue;
      if(h.vegetariano&&l.p.tipo) continue;
      const q=r2(Math.min(l.sobra, papel[1]*raciones));
      if(q<=0) continue;
      l.sobra=r2(l.sobra-q); l.aprovechado=q; l.usos.push('Plato de aprovechamiento'); comido.push([l.pid,q,papel[0]]);
    }
    const hayProteina=comido.some(([,,papel])=>papel==='prot');
    const sinHuevo=h.alergias.includes('huevo');
    const forma = hayProteina||sinHuevo ? 'salteado' : 'tortilla';
    const base = forma==='salteado' ? [['arroz',70],['aceite',10]] : [['huevos',2],['aceite',10]];
    for(const [pid,q] of base){ necesario[pid]=(necesario[pid]||0)+q*raciones; (usos[pid]||(usos[pid]=new Set())).add('Plato de aprovechamiento'); }
    // recalcula solo las líneas de la base (no son frescos: no cambian las sobras de lo demás)
    for(const [pid] of base){
      const nueva=lineaDe(pid), i=lineas.findIndex(l=>l.pid===pid);
      if(i>=0) lineas[i]=nueva; else lineas.push(nueva);
    }
    aprov={forma,comido,base,raciones};
  }
  let total=0, totalSinDespensa=0, desperdicio=0;
  for(const l of lineas){
    l.tira = l.fresco&&l.sobra>0 ? r2(l.sobra*l.coste/l.cant) : 0;
    if(l.tira<0.10) l.tira=0;   // restos de céntimos (5 g, media rodaja): no cuentan como desperdicio
    total+=l.coste; totalSinDespensa+=l.costeSin; desperdicio+=l.tira;
  }
  let ahorro=null;
  if(menu===state.menu){ describirAprov(aprov); ahorro=calcularAhorro(menu,h,necRecetas,extra,huecosAprov,r2(total),r2(totalSinDespensa-total)); }
  return {lineas,total:r2(total),ahorroDespensa:r2(totalSinDespensa-total),desperdicio:r2(desperdicio),aprov,ahorro};
}
// Pone nombre, ingredientes y pasos al plato de aprovechamiento de esta semana
function describirAprov(a){
  const R=REC.aprovechar;
  if(!a){ R.nombre='Plato de aprovechamiento'; R.ing=[]; R.pasos=[]; R.usa=[]; return; }
  const n=a.raciones, visible=([pid,q])=>q/n >= (PROD[pid].unidad==='ud'?0.1:15);
  const lista=arr=>{ const x=[...new Set(arr)]; return x.length>1? x.slice(0,-1).join(', ')+' y '+x.at(-1) : (x[0]||''); };
  const principal=a.comido.filter(([,,p])=>p==='prot'||p==='veg');
  const orden=[...principal.filter(([,,p])=>p==='prot'),...principal.filter(([,,p])=>p==='veg')];
  const nombres=lista(orden.filter(visible).filter(([pid])=>pid!=='nata'&&pid!=='mozzarella').map(([pid])=>CORTO[pid]).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3));
  const ensalada=a.comido.some(([,,p])=>p==='ens'), pan=a.comido.some(([,,p])=>p==='pan');
  const extra=[ensalada?'ensalada':'',pan?'pan':''].filter(Boolean);
  const cola=extra.length?' con '+lista(extra):'';
  R.ing=[...a.comido.map(([pid,q])=>[pid,q/n]),...a.base];
  R.usa=a.comido.map(([pid])=>pid);
  if(a.forma==='salteado'){
    R.nombre=(nombres?`Salteado de ${nombres}`:'Arroz salteado')+cola;
    R.pasos=['Cuece el arroz 16 minutos y escúrrelo.','Trocea lo que ha sobrado de la semana.','Saltéalo a fuego fuerte con el aceite: primero la carne o el pescado y luego las verduras.','Añade el arroz, mezcla y ajusta de sal.'];
  } else {
    R.nombre=(nombres?`Tortilla de ${nombres}`:'Tortilla francesa')+cola;
    R.pasos=['Trocea las verduras que han sobrado y pócalas en el aceite 8-10 minutos.','Bate los huevos con sal y mézclalos con las verduras.','Cuaja la tortilla por los dos lados.'];
  }
  if(ensalada) R.pasos.push('Acompaña con una ensalada de lo que quede de lechuga o pepino.');
  if(pan) R.pasos.push('Tuesta el pan que sobra y sírvelo aparte.');
  DISH.aprovechar = a.forma==='salteado'
    ? {k:'rice', base:'#E9D9A6', grain:'#F7E6A6', tops:['#7CB342','#E07B2E','#D64533','#C98A50']}
    : {k:'tortilla', base:'#F0C04B', tops:['#7CB342','#D64533','#E9D9A6']};
}
/* ---------- Ahorro frente a una compra habitual ----------
   «Habitual» = este mismo menú comprado como lo haría casi todo el mundo:
   el envase de siempre en los frescos (lo que sobra se acaba tirando), sin mirar lo que hay en casa
   y cocinando otra cena normal en lugar de la cena con sobras. Así la comparación es justa:
   mismos platos, mismas personas, mismos precios. */
function calcularAhorro(menu,h,necR,extra,huecosAprov,total,despensa){
  let habitual=0, optimo=0;
  for(const pid of Object.keys(necR)){
    const p=PROD[pid], q=r2((necR[pid]||0)+(extra[pid]||0)); if(q<=0) continue;
    const mejor=mejorCompra(p,q).coste;
    // Solo los frescos cuentan como ahorro por formato: lo que sobra de arroz, legumbres o latas se guarda, no se pierde.
    habitual+= perecedero(p) ? Math.ceil(q/p.envase-1e-9)*p.precio : mejor; optimo+=mejor;
  }
  let cena=0;
  if(huecosAprov){ const cenas=[]; menu.forEach((d,i)=>{ if(enCompra(i)){ const r=REC[d.cena]; if(r&&!r.aprov) cenas.push(costeRacion(r)); } });
    const media=cenas.length?cenas.reduce((a,b)=>a+b,0)/cenas.length:3; cena=media*h.personas*huecosAprov; }
  habitual=r2(habitual+cena);
  const totalAh=Math.max(0,r2(habitual-total)), formatos=Math.max(0,r2(habitual-cena-optimo));
  const desp=Math.max(0,Math.min(despensa,r2(totalAh-formatos)));
  const sobras=Math.max(0,r2(totalAh-formatos-desp));
  return {habitual, total:totalAh, formatos:r2(totalAh-desp-sobras), despensa:desp, sobras, mes:r2(totalAh*30/Math.max(1,cadaDias()))};
}

  const tirar=c.lineas.filter(l=>l.tira>0), guarda=c.lineas.filter(l=>!l.fresco&&l.sobra>0);

    <div class="ah-foot">${c.desperdicio<=0.5?ic('hoja',15)+' No se tira comida':`${ic('alerta',15)} Se tirarían ${eur(c.desperdicio)} en frescos`}</div>

const puntuacion = c => c.total + 2*c.desperdicio;

function menuCon(dia,momento,rid){ return state.menu.map((d,i)=>i===dia?{...d,[momento]:rid}:d); }
function dondeEsta(rid){ for(let i=0;i<7;i++) for(const m of MOMENTOS) if(state.menu[i][m]===rid) return {dia:i,momento:m}; return null; }
function vecesEnMenu(rid,menu=state.menu){ return menu.reduce((n,d)=>n+(d.comida===rid)+(d.cena===rid),0); }

// Alternativas para un hueco, con la diferencia REAL en la cesta (incluye efecto de envases y despensa)
function alternativas(dia,momento){
  const base=calcularCesta().total, actual=state.menu[dia][momento];
  return RECETAS.filter(r=>r.momentos.includes(momento) && compatible(r) && (!r.aprov||esDiaReciclaje(dia)) && (r.id===actual||!vecesEnMenu(r.id)))
    .map(r=>({r,delta: r.id===actual?0:r2(calcularCesta(menuCon(dia,momento,r.id)).total-base), actual:r.id===actual}))
    .sort((a,b)=>a.delta-b.delta);
}

// Mejores sustituciones para abaratar la cesta (máx. 2 veces la misma receta por semana)
// Las sugerencias y caprichos solo se recalculan cuando cambia el menú, el hogar o la despensa
const memo={};
function recordar(k,fn){ const clave=JSON.stringify([state.menu,state.hogar,state.despensa]); if(memo[k]?.clave!==clave) memo[k]={clave,v:fn()}; return memo[k].v; }
// Mejores sustituciones para abaratar la cesta. Se guardan varias opciones por hueco y luego se reparten
// para que cada plato propuesto salga una sola vez (si no, todas las sugerencias serían el plato más barato).
function sugerencias(){ return recordar('sugerencias',sugerenciasCalc); }
function sugerenciasCalc(){
  const base=calcularCesta().total, huecos=[];
  state.menu.forEach((d,i)=>MOMENTOS.forEach(m=>{
    if(esDiaReciclaje(i)||!enCompra(i)) return;
    const ops=[];
    for(const r of RECETAS){
      if(r.aprov||r.premium||r.id===d[m]||!r.momentos.includes(m)||!compatible(r)||vecesEnMenu(r.id)>=1) continue;
      const delta=r2(calcularCesta(menuCon(i,m,r.id)).total-base);
      if(delta<-0.01) ops.push({dia:i,momento:m,de:d[m],a:r.id,delta});
    }
    ops.sort((x,y)=>x.delta-y.delta);
    if(ops.length) huecos.push(ops.slice(0,6));
  }));
  huecos.sort((x,y)=>x[0].delta-y[0].delta);
  const usados=new Set(), out=[];
  for(const ops of huecos){ const o=ops.find(x=>!usados.has(x.a)); if(o){ usados.add(o.a); out.push(o); } }
  return out.sort((x,y)=>x.delta-y.delta);
}

// Mejoras premium: platos especiales que se pueden meter, con lo que suben la cesta
function mejoras(){ return recordar('mejoras',mejorasCalc); }
function mejorasCalc(){
  const base=calcularCesta().total, out=[];
  // para cada plato premium que aún no está en el menú, el hueco donde menos sube la cesta
  for(const r of RECETAS){
    if(!r.premium||!compatible(r)||vecesEnMenu(r.id)>=1) continue;
    let best=null;
    state.menu.forEach((d,i)=>MOMENTOS.forEach(m=>{
      if(esDiaReciclaje(i)||!enCompra(i)||!r.momentos.includes(m)||REC[d[m]]?.premium) return;
      const delta=r2(calcularCesta(menuCon(i,m,r.id)).total-base);
      if(!best||delta<best.delta) best={dia:i,momento:m,de:d[m],a:r.id,delta};
    }));
    if(best) out.push(best);
  }
  return out.sort((a,b)=>a.delta-b.delta);
}

/* ---------- Día de aprovechamiento ----------
   Un día a la semana se rellena solo con los platos que mejor gastan lo que sobra del resto de la semana:
   se prueba cada receta compatible y se queda la que deja la cesta más barata contando el desperdicio. */
/* ---------- Compra por días ----------
   «dias» son los días de la semana que entran en esta compra: la semana entera (de lunes a domingo),
   unos cuantos seguidos (por ejemplo, 3) o días sueltos elegidos a mano. Solo esos días cuentan
   para la lista, el presupuesto y el aprovechamiento. */
function diasElegidos(){ const h=state.hogar;
  if(Array.isArray(h.dias)&&h.dias.length) return h.dias;
  const n=[2,3,4].includes(h.cadaDias)?h.cadaDias:7; // datos guardados de la versión anterior
  return n===7?[0,1,2,3,4,5,6]:Array.from({length:n},(_,k)=>((h.inicio||0)+k)%7); }
function diasCompra(){ const d=[...new Set(diasElegidos())]; if(d.length===7) return [0,1,2,3,4,5,6]; const hoy=diaHoy(); return d.sort((a,b)=>((a-hoy+7)%7)-((b-hoy+7)%7)); }
const cadaDias = () => diasCompra().length;
const seguidosDesde = (ini,n) => Array.from({length:n},(_,k)=>(ini+k)%7);
const sonSeguidos = () => { const d=diasCompra(); return d.every((x,k)=>k===0||x===(d[k-1]+1)%7); };
const enCompra = i => diasCompra().includes(i);
const limite = () => cadaDias()===7 ? state.hogar.presupuesto : r2(state.hogar.presupuesto*cadaDias()/7);
function nombresDias(dias){ const n=dias.map(i=>DIAS[i].slice(0,3).toLowerCase()); return n.length>1? n.slice(0,-1).join(', ')+' y '+n.at(-1) : n[0]; }
const textoCompra = () => cadaDias()===7 ? 'de lunes a domingo' : nombresDias(diasCompra());
function diaAprov(){ const h=state.hogar; if(!h.reciclaje) return -1; const n=cadaDias(); if(n===7) return h.diaReciclaje; if(n>=3) return diasCompra().at(-1); return -1; }
const esDiaReciclaje = i => i===diaAprov();
function aprovechar(){
  const h=state.hogar;
  // quita platos de aprovechamiento fuera de su día
  state.menu.forEach((d,i)=>MOMENTOS.forEach(m=>{ if(d[m]==='aprovechar'&&!esDiaReciclaje(i)) d[m]=null; }));
  const d=diaAprov();
  if(d<0){ rellenarHuecos(); return; }
  state.menu[d].cena='aprovechar';
  const m='comida', fuera=rid=>vecesEnMenu(rid)-(state.menu[d][m]===rid?1:0);
  let best=null;
  const antes=new Set(state.anteriores||[]);
  for(const evitar of [true,false]){
    for(const r of RECETAS){
      if(r.premium||r.aprov||!r.momentos.includes(m)||!compatible(r)||fuera(r.id)>0||(evitar&&antes.has(r.id))) continue;
      const sc=puntuacion(calcularCesta(menuCon(d,m,r.id)));
      if(!best||sc<best.sc-1e-6) best={r,sc};
    }
    if(best) break;
  }
  if(best&&!(state.fijados||{})[d+'-'+m]) state.menu[d][m]=best.r.id;
  rellenarHuecos();
}
// Si se desactiva el aprovechamiento, el hueco que deja se rellena con la receta que menos sube la cesta
function rellenarHuecos(){
  state.menu.forEach((d,i)=>MOMENTOS.forEach(m=>{
    if(d[m]||!enCompra(i)) return;
    let best=null; const antes=new Set(state.anteriores||[]);
    for(const evitar of [true,false]){
      for(const r of RECETAS){
        if(r.premium||r.aprov||!r.momentos.includes(m)||!compatible(r)||vecesEnMenu(r.id)>=1||(evitar&&antes.has(r.id))) continue;
        const sc=puntuacion(calcularCesta(menuCon(i,m,r.id)));
        if(!best||sc<best.sc) best={r,sc};
      }
      if(best) break;
    }
    if(best) d[m]=best.r.id;
  }));
}

// Ingredientes de una receta que ya se compran para otros platos de la semana
function ingredientesAprovechados(dia,momento){
  const r=REC[state.menu[dia][momento]]; if(!r) return [];
  const otros=new Set();
  state.menu.forEach((dd,i)=>MOMENTOS.forEach(m=>{ if(i===dia&&m===momento) return; const x=REC[dd[m]]; if(x) x.ing.forEach(([pid])=>otros.add(pid)); }));
  return r.ing.map(([pid])=>pid).filter(pid=>otros.has(pid));
}

function ajustarAlPresupuesto(){
  let pasos=0;
  while(calcularCesta().total>limite() && pasos<14){
    const s=sugerencias()[0]; if(!s) break;
    state.menu[s.dia][s.momento]=s.a; aprovechar(); pasos++;
  }
  return pasos;
}

function proponerMenu(){
  const h=state.hogar;
  const pool=m=>{
    let c=RECETAS.filter(r=>!r.premium&&!r.aprov&&r.momentos.includes(m)&&compatible(r));
    if(h.rapido){ const q=c.filter(r=>r.min<=30); if(q.length>=cadaDias()*2+2) c=q; }
    return c;
  };
  const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  // Nunca se repite un plato en el menú. Además se evitan los de la compra anterior mientras haya recetas de sobra.
  state.anteriores=state.menu.flatMap((d,i)=>enCompra(i)?[d.comida,d.cena]:[]).filter(x=>x&&x!=='aprovechar');
  const antes=new Set(state.anteriores);
  const usados=new Set(state.menu.flatMap((d,i)=>enCompra(i)?[]:[d.comida,d.cena]).filter(Boolean));
  const elegir=m=>{
    const c=shuffle(pool(m));
    const r=c.find(r=>!usados.has(r.id)&&!antes.has(r.id))||c.find(r=>!usados.has(r.id));
    if(!r) return null; usados.add(r.id); return r.id;
  };
  state.fijados={};
  state.menu=DIAS.map((_,i)=>enCompra(i)?{comida:elegir('comida'),cena:elegir('cena')}:(state.menu[i]||{comida:null,cena:null}));
  aprovechar();
  // Repaso: en cada hueco prueba unas cuantas recetas al azar y se queda la que menos desperdicia
  for(let i=0;i<7;i++) for(const m of MOMENTOS){
    if(esDiaReciclaje(i)||!enCompra(i)) continue;
    const base=puntuacion(calcularCesta()), otro=MOMENTOS.find(x=>x!==m);
    let best=null;
    for(const r of shuffle(pool(m)).slice(0,8)){
      if(r.id===state.menu[i][m]||state.menu[i][otro]===r.id||vecesEnMenu(r.id)>=1||antes.has(r.id)) continue;
      const sc=puntuacion(calcularCesta(menuCon(i,m,r.id)));
      if(sc<base-0.3&&(!best||sc<best.sc)) best={r,sc};
    }
    if(best){ state.menu[i][m]=best.r.id; aprovechar(); }
  }
  ajustarAlPresupuesto(); aprovechar();
}

function pintarEstado(){
  const c=calcularCesta(), h=state.hogar, L=limite(), pct=Math.min(100,c.total/L*100), over=c.total>L;
  document.getElementById('status').innerHTML=`
    <div class="st-main"><div class="st-total"><strong class="num">${eur(c.total)}</strong><span class="num">de ${eur(L)}</span></div>
      <div class="st-side"><b class="num">${over?'Te pasas '+eur(c.total-L):'Te sobran '+eur(L-c.total)}</b><span>${c.ahorro&&c.ahorro.total>=0.5?`Ahorras <b class="num">${eur(c.ahorro.total)}</b>`:`${h.personas} ${h.personas===1?'persona':'personas'} · ${numPlatos()} platos`}</span></div></div>
    ${navigator.onLine===false?`<div class="offline">${ic('sinred',16)} Sin conexión · la app sigue funcionando</div>`:''}
    <div class="meter ${over?'over':''}" role="progressbar" aria-label="Cesta frente a presupuesto" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
  return c;
}
function render(){

/* ================= Recetas: buscador y categorías ================= */
let busq='', catSel=null;
const BASICOS=new Set(['caldo','aceite','pimenton','ajo','cebolla']);  // no cuentan al buscar: están en casi todo
function coincide(r,q,cat){
  if(cat&&!CATEGORIAS.find(c=>c.k===cat).f(r)) return false;
  const palabras=sinAcentos(q).split(/\s+/).filter(Boolean);
  if(!palabras.length) return true;
  const pajar=sinAcentos([r.nombre,...catsDe(r).map(c=>c.n+' '+c.kw),...r.ing.filter(([pid])=>!BASICOS.has(pid)).map(([pid])=>PROD[pid].nombre)].join(' '));
  return palabras.every(w=>pajar.includes(w)||(w.length>4&&pajar.includes(w.replace(/(es|s)$/,''))));
}
function recetasFiltradas(){ return RECETAS.filter(r=>!r.aprov&&coincide(r,busq,catSel)); }
function tarjetaReceta(r){
  const h=state.hogar, en=vecesEnMenu(r.id), ok=compatible(r);
  return `<button class="rcard ${ok?'':'off'}" data-act="ficha" data-v="${r.id}">
    <span class="rpic">${dishSVG(r.id,true)}${r.premium?`<span class="badge">${ic('estrella',14)}</span>`:''}${en?`<span class="badge enm">✓ En tu menú</span>`:''}</span>
    <span class="rtxt"><span class="name">${esc(r.nombre)}</span>
      <span class="meta"><span>${ic('reloj',14)} ${r.min}′</span><span class="num">${eur(costeRacion(r)*h.personas)}</span></span>
      ${ok?'':`<span class="small" style="color:var(--bad)">No encaja con tus alergias o preferencias</span>`}</span></button>`;
}
function resultadosHTML(){
  const rs=recetasFiltradas();
  if(!rs.length) return `<p class="muted" style="margin:0">No hay recetas para «${esc(busq)}». Prueba con pasta, sopa, arroz, pollo…</p>`;
  return `<div class="label">${rs.length} ${rs.length===1?'receta':'recetas'}${catSel?' · '+CATEGORIAS.find(c=>c.k===catSel).n:''}</div><div class="rgrid">${rs.map(tarjetaReceta).join('')}</div>`;
}
function vRecetas(){
  return `<section data-view="recetas">
    <div class="view-head"><h2>Recetas</h2></div>
    <div class="search"><span aria-hidden="true">${icon('buscar',18)}</span><input id="buscar" type="search" placeholder="Pasta, sopa, arroz, pollo…" value="${esc(busq)}" autocomplete="off" aria-label="Buscar recetas"></div>
    <div class="cats" role="group" aria-label="Categorías">${CATEGORIAS.map(c=>`<button class="cat" data-act="cat" data-v="${c.k}" aria-pressed="${catSel===c.k}"><span class="t-emo">${c.e}</span><span>${c.n}</span><span class="cnt num">${RECETAS.filter(r=>!r.aprov&&c.f(r)).length}</span></button>`).join('')}</div>
    <div id="res" style="display:grid;gap:10px">${resultadosHTML()}</div>
  </section>`;
}

/* Ficha para poner una receta en el menú */
let ficha=null;
function abrirFicha(rid){
  const r=REC[rid], m=r.momentos.includes('comida')?'comida':'cena';
  ficha={rid,dia:diaSel,momento:r.momentos.includes(m)?m:r.momentos[0]};
  if(bloqueado(ficha.dia,ficha.momento)) ficha.dia=(ficha.dia+1)%7;
  pintarFicha();
}
const bloqueado=(d,m)=>esDiaReciclaje(d)&&m==='cena';
function pintarFicha(){
  if(!ficha) return;
  const r=REC[ficha.rid], h=state.hogar, {dia,momento}=ficha;
  const actual=REC[state.menu[dia][momento]], bloq=bloqueado(dia,momento);
  const delta=bloq?0:r2(calcularCesta(menuCon(dia,momento,r.id)).total-calcularCesta().total);
  document.getElementById('layer').innerHTML=`<div class="sheet-back" data-act="cerrar"><div class="sheet" role="dialog" aria-modal="true" aria-label="Poner en el menú">
    <div class="row between"><span class="label">${catsDe(r).map(c=>c.e+' '+c.n).slice(0,2).join(' · ')}</span><button class="icon-btn" data-act="cerrar" aria-label="Cerrar">${icon('x',20)}</button></div>
    <div class="thumb xl">${dishSVG(r.id,true)}</div>
    <div><h3>${esc(r.nombre)}</h3><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px"><span class="pill plain">${r.min} min</span><span class="pill plain num">${eur(costeRacion(r)*h.personas)} para ${h.personas}</span>${r.premium?`<span class="pill premium">${ic('estrella',14)}Premium</span>`:''}${esVegetariana(r)?'<span class="pill">Vegetariana</span>':''}${alergenosReceta(r).map(a=>`<span class="pill ${h.alergias.includes(a)?'bad':'warn'}">${ALERGENOS[a]}</span>`).join('')}</div></div>
        <div style="display:grid;gap:8px"><div class="label">¿Qué día?</div>
      <div class="dias">${DIAS.map((dn,i)=>`<button class="chip" data-act="fdia" data-v="${i}" aria-pressed="${i===dia}">${dn.slice(0,3)}${esDiaReciclaje(i)?' '+ic('sobras',14):''}</button>`).join('')}</div></div>
    <div style="display:grid;gap:8px"><div class="label">¿Comida o cena?</div>
      <div class="seg">${MOMENTOS.map(m=>`<button data-act="fmom" data-v="${m}" aria-pressed="${m===momento}" ${r.momentos.includes(m)?'':'disabled'}>${m==='comida'?ic('sol',16)+'Comida':ic('luna',16)+'Cena'}</button>`).join('')}</div></div>
    ${bloq?`<div class="notice ok-notice"><span>${icon('sobras',18)}</span><span>Esa cena es la de sobras. Elige otro hueco.</span></div>`
      :(()=>{ const dd=dondeEsta(r.id); if(dd&&!(dd.dia===dia&&dd.momento===momento)) return `<div class="notice"><span>${icon('cambiar',18)}</span><span><b>Ya lo tienes el ${DIAS[dd.dia].toLowerCase()} (${dd.momento}).</b> Se cambian de sitio${actual&&actual.id!==r.id?`: ${esc(actual.nombre)} pasa a ese hueco`:''}.</span></div>`;
        return `<div class="small muted">${actual?`Sustituye a <b>${esc(actual.nombre)}</b>. `:''}${Math.abs(delta)<0.01?'La cesta no cambia.':(delta>0?`La cesta sube ${eur(delta)}.`:`La cesta baja ${eur(-delta)}.`)}</div>`; })()}
    <button class="btn block xl" data-act="fponer" ${bloq||!compatible(r)?'disabled':''}>${!compatible(r)?'No encaja con tus alergias':(dondeEsta(r.id)?'Cambiar de día':'Poner en el menú')}</button>
    <details class="covered"><summary>Ver ingredientes y preparación</summary>
      <ul class="ing-list">${r.ing.map(([pid,q])=>`<li><span><span class="ie">${emo(pid)}</span>${esc(PROD[pid].nombre)}</span><span class="num muted">${fmtQty(q*h.personas,PROD[pid])}</span></li>`).join('')}</ul>
      <ol class="steps" style="margin-top:8px">${r.pasos.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></details>
  </div></div>`;
}

let altsCache=null;
function altsHTML(alts){

  if(!hoja) return;

    ${r?`<div><h3>${esc(r.nombre)}</h3><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">
      <span class="pill plain">${r.min} min</span>${r.aprov?`<span class="pill">${ic('sobras',14)}Hecho con lo que sobra</span>`:`<span class="pill plain num">${eur(costeRacion(r))}/ración</span><span class="pill plain num">${eur(costeRacion(r)*h.personas)} total</span>`}

// Fin de semana: lo que sobra y se conserva pasa a la despensa; los frescos se dan por gastados
function nuevaSemana(){
  const c=calcularCesta(), nueva={};
  for(const [pid,q] of Object.entries(state.despensa)) if(!c.lineas.some(l=>l.pid===pid)) nueva[pid]=q;
  for(const l of c.lineas){
    let resto=r2((state.despensa[l.pid]||0)-l.enCasa+l.sobra);
    if(l.p.unidad==='ud') resto=Math.floor(resto+1e-9);
    if(!l.fresco&&resto>=Math.max(1,l.p.envase*0.02)) nueva[l.pid]=resto;
  }
  state.despensa=nueva; state.marcados={}; state.extras={};
  if(cadaDias()<7) state.hogar.dias=seguidosDesde((diasCompra().at(-1)+1)%7,cadaDias());
  proponerMenu(); save(); diaSel=diaInicial();
  toast(cadaDias()<7?`Siguiente compra lista: ${textoCompra()}`:'¡Menú nuevo listo!'); irA('menu');
}

function copiar(){
  const c=calcularCesta(); let txt=`Mi compra en Mercadona · ${state.hogar.personas} personas · ${eur(c.total)} (precios demo, sin verificar)\n`;
  SECCIONES.forEach(s=>{const ls=c.lineas.filter(l=>l.envases>0&&l.p.seccion===s); if(!ls.length) return;
    txt+=`\n${s.toUpperCase()}\n`+ls.map(l=>`☐ ${l.p.nombre}: ${fmtPartes(l.partes,l.p)} · ${eur(l.coste)}`).join('\n')+'\n';});
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){} ta.remove(); toast(ok?'Lista copiada':'No se pudo copiar');};
  try{ navigator.clipboard.writeText(txt).then(()=>toast('Lista copiada'),fallback); }catch(e){ fallback(); }
}

/* ================= Compra familiar compartida =================
   Todos los de casa ven y cambian el mismo menú, lista, despensa y lo marcado en el carro.
   Se entra con un enlace o un código de 12 letras, sin contraseñas.
   Los datos viven en Supabase; la app solo usa la clave PÚBLICA (anon), que con las
   funciones de supabase/familia.sql solo deja leer o guardar la familia cuyo código conoces.
   La clave privada (service_role) nunca va en este archivo. */
const FAMILIA_API={url:'', clave:''};   // se rellena al conectar Supabase
try{ if(location.hostname==='localhost'){ const d=JSON.parse(localStorage.getItem('mci-api-pruebas')||'null'); if(d) Object.assign(FAMILIA_API,d); } }catch(e){}
const FKEY='mci-familia', COMPARTIDO=['hogar','menu','extras','despensa','marcados','fijados','anteriores'];
let fam=null; try{ fam=JSON.parse(localStorage.getItem(FKEY)||'null'); }catch(e){}
const famEstado={sinc:null, error:false, enviando:false, pendiente:false, diferido:false};
const familiaDisponible=()=>!!FAMILIA_API.url;
const fmtCodigo=c=>String(c||'').replace(/(.{4})(?=.)/g,'$1-');
const limpiaCodigo=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const enlaceFamilia=()=>URL_APP+'?familia='+fam.codigo;
function guardarFam(){ try{ fam?localStorage.setItem(FKEY,JSON.stringify(fam)):localStorage.removeItem(FKEY); }catch(e){} }
function compartido(s=state){ const o={}; for(const k of COMPARTIDO) if(s[k]!==undefined) o[k]=s[k]; return JSON.parse(JSON.stringify(o)); }
const igual=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
// Junta los cambios de dos personas a partir de lo último que ambos tenían (base): gana lo que cada uno cambió.
function fusion(b,l,r){
  if(igual(l,b)) return r; if(igual(r,b)) return l;
  const obj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  if(obj(l)&&obj(r)){ const o={}; for(const k of new Set([...Object.keys(l),...Object.keys(r)])){ const v=fusion(obj(b)?b[k]:undefined,l[k],r[k]); if(v!==undefined) o[k]=v; } return o; }
  if(Array.isArray(l)&&Array.isArray(r)&&l.length===r.length) return l.map((x,i)=>fusion(Array.isArray(b)?b[i]:undefined,x,r[i]));
  return l;
}
async function rpc(fn,args){
  const r=await fetch(FAMILIA_API.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',cache:'no-store',
    headers:Object.assign({'Content-Type':'application/json',apikey:FAMILIA_API.clave},/^sb_publishable_/.test(FAMILIA_API.clave)?{}:{Authorization:'Bearer '+FAMILIA_API.clave}),body:JSON.stringify(args)});
  if(!r.ok) throw new Error(fn+' '+r.status); const t=await r.text(); return t?JSON.parse(t):null;
}
const fila=x=>Array.isArray(x)?x[0]:x;
function aplicarRemoto(est){ const antes=compartido(); Object.assign(state,JSON.parse(JSON.stringify(est))); state.hogar=Object.assign(EJEMPLO().hogar,state.hogar); guardarLocal(); return !igual(antes,compartido()); }
function refrescarVista(aviso){
  const el=document.activeElement; if(el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&el.type!=='checkbox'){ famEstado.diferido=aviso||true; return; }
  famEstado.diferido=false; render(); if(hoja) pintarHoja(); if(ficha) pintarFicha(); if(extrasHoja) pintarExtras(); if(aviso) toast(aviso);
}
document.addEventListener('focusout',()=>setTimeout(()=>{ if(famEstado.diferido) refrescarVista(famEstado.diferido===true?null:famEstado.diferido); },50));
let envioT=null;
function programarEnvio(){ clearTimeout(envioT); envioT=setTimeout(enviar,600); }
async function enviar(){
  if(!fam||!familiaDisponible()) return;
  if(famEstado.enviando){ famEstado.pendiente=true; return; }
  famEstado.enviando=true;
  try{
    for(let i=0;i<5;i++){
      const est=compartido();
      const res=fila(await rpc('guardar_hogar',{p_codigo:fam.codigo,p_estado:est,p_version:fam.version}));
      if(!res){ famEstado.error='perdida'; break; }
      if(res.ok){ fam.version=res.version; fam.base=est; guardarFam(); famEstado.sinc=Date.now(); famEstado.error=false; break; }
      // Otro miembro guardó antes: juntamos sus cambios con los nuestros y reintentamos
      const junto=fusion(fam.base,est,res.estado); fam.base=res.estado; fam.version=res.version; guardarFam();
      if(aplicarRemoto(junto)) refrescarVista();
    }
  }catch(e){ famEstado.error=true; }
  finally{ famEstado.enviando=false; pintarFamiliaEstado(); if(famEstado.pendiente){ famEstado.pendiente=false; enviar(); } }
}
async function consultar(){
  if(!fam||!familiaDisponible()||famEstado.enviando||document.visibilityState==='hidden') return;
  try{
    const v=await rpc('version_hogar',{p_codigo:fam.codigo});
    if(v===null){ famEstado.error='perdida'; pintarFamiliaEstado(); return; }
    if(Number(v)!==fam.version){
      const r=fila(await rpc('leer_hogar',{p_codigo:fam.codigo})); if(!r) return;
      const local=compartido(), junto=fusion(fam.base,local,r.estado);
      fam.base=r.estado; fam.version=Number(r.version); guardarFam();
      const cambio=aplicarRemoto(junto);
      if(!igual(junto,r.estado)) programarEnvio();
      if(cambio) refrescarVista('Tu familia ha actualizado la compra');
    }
    famEstado.sinc=Date.now(); famEstado.error=false;
  }catch(e){ famEstado.error=true; }
  pintarFamiliaEstado();
}
setInterval(consultar,6000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') consultar(); });
window.addEventListener('online',()=>{ if(fam){ enviar(); consultar(); } });

function textoSinc(){
  if(!fam) return '';
  if(famEstado.error==='perdida') return 'No se encuentra esta compra familiar';
  if(famEstado.error||navigator.onLine===false) return 'Sin conexión · tus cambios se enviarán al volver';
  if(!famEstado.sinc) return 'Conectando…';
  const s=Math.round((Date.now()-famEstado.sinc)/1000);
  return s<10?'Al día con tu familia':s<60?`Actualizado hace ${s} s`:`Actualizado hace ${Math.round(s/60)} min`;
}

    <button class="btn block" data-act="fam-crear">Crear compra familiar</button>
    <button class="linkbtn" data-act="fam-codigo">Tengo un código</button></div>`;
  return `<div class="card bigq" id="familia"><div class="q-title"><span class="q-emo">${icon('personas',26)}</span><span>Compra familiar</span></div>
    <p class="small" style="margin:0"><b>Compartida con tu familia</b><br><span class="muted" id="fam-sinc">${textoSinc()}</span></p>
    <div class="fam-code num">${fmtCodigo(fam.codigo)}</div>
    <button class="btn block" data-act="fam-invitar">Invitar a alguien</button>
    <button class="linkbtn" data-act="fam-salir">Salir de la compra familiar</button></div>`;
}
function hojaFamilia(html){ document.getElementById('layer').innerHTML=`<div class="sheet-back" data-act="cerrar"><div class="sheet" role="dialog" aria-modal="true" aria-label="Compra familiar">
  <div class="row between"><span class="label">Compra familiar</span><button class="icon-btn" data-act="cerrar" aria-label="Cerrar">${icon('x',20)}</button></div>${html}</div></div>`; }
function hojaInvitar(){
  const url=enlaceFamilia(), txt='Únete a nuestra compra familiar en Mi Compra Inteligente:';
  hojaFamilia(`<h3>Invita a los de casa</h3>
    <p class="small muted" style="margin:0">Quien abra este enlace verá el mismo menú y la misma lista que tú, y podrá añadir y marcar cosas.</p>
    ${navigator.share?`<button class="btn block xl" data-act="fam-compartir">Enviar invitación</button>`:''}
    <a class="btn ${navigator.share?'ghost':'xl'} block" href="https://wa.me/?text=${encodeURIComponent(txt+' '+url)}" target="_blank" rel="noopener">Enviar por WhatsApp</a>
    <button class="btn ghost block" data-act="fam-copiar">Copiar enlace</button>
    <p class="small muted" style="margin:0;text-align:center">O que pongan este código en Ajustes:<br><b class="fam-code num sel">${fmtCodigo(fam.codigo)}</b></p>
    <p class="small muted" style="margin:0">Comparte el código solo con tu familia: quien lo tenga puede ver y cambiar vuestra compra.</p>`);
}
function hojaCodigo(){
  hojaFamilia(`<h3>Unirme a una compra familiar</h3>
    <input id="fam-input" class="fam-input num" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX" aria-label="Código de la compra familiar">
    <p class="small muted" style="margin:0">Tu menú y tu lista actuales se sustituyen por los de la familia.</p>
    <button class="btn block xl" data-act="fam-unir">Unirme</button>`);
  setTimeout(()=>document.getElementById('fam-input')?.focus(),50);
}
function hojaInvitacion(codigo){
  hojaFamilia(`<h3>Te han invitado a una compra familiar</h3>
    <p class="small muted" style="margin:0">Verás el mismo menú y la misma lista que el resto de la casa, y podréis añadir y marcar cosas entre todos.${state.nuevo?'':' Tu menú y tu lista actuales se sustituirán.'}</p>
    <button class="btn block xl" data-act="fam-aceptar" data-v="${codigo}">Unirme</button>
    <button class="btn ghost block" data-act="fam-rechazar">Ahora no</button>`);
}
async function unirse(codigo){
  const c=limpiaCodigo(codigo);
  if(!/^[A-Z0-9]{12}$/.test(c)){ toast('El código tiene 12 letras y números'); return; }
  try{
    const r=fila(await rpc('leer_hogar',{p_codigo:c}));
    if(!r){ toast('No hay ninguna compra familiar con ese código'); return; }
    fam={codigo:c,version:Number(r.version),base:r.estado}; guardarFam();
    delete state.nuevo; delete state.ejemplo; aplicarRemoto(r.estado); famEstado.sinc=Date.now(); famEstado.error=false;
    document.getElementById('layer').innerHTML=''; diaSel=diaInicial(); irA('menu'); toast('Ya estás en la compra familiar');
  }catch(e){ toast('No se ha podido conectar. Prueba otra vez con internet.'); }
}
async function accionFamilia(a,t){
  if(a==='fam-crear'){
    try{ const est=compartido(); const r=fila(await rpc('crear_hogar',{p_estado:est}));
      fam={codigo:r.codigo,version:Number(r.version),base:est}; guardarFam(); delete state.ejemplo; guardarLocal(); famEstado.sinc=Date.now(); famEstado.error=false; render(); hojaInvitar();
    }catch(e){ toast('No se ha podido crear. Prueba otra vez con internet.'); }
    return;
  }
  if(a==='fam-codigo') return hojaCodigo();
  if(a==='fam-rechazar'){ document.getElementById('layer').innerHTML=''; if(state.nuevo) pintarBienvenida(); return; }
  if(a==='fam-unir') return unirse(document.getElementById('fam-input')?.value);
  if(a==='fam-aceptar') return unirse(t.dataset.v);
  if(a==='fam-invitar') return hojaInvitar();
  if(a==='fam-compartir'){ try{ await navigator.share({title:'Mi Compra Inteligente',text:'Únete a nuestra compra familiar',url:enlaceFamilia()}); }catch(e){} return; }
  if(a==='fam-copiar'){ try{ await navigator.clipboard.writeText(enlaceFamilia()); toast('Enlace copiado'); }catch(e){ toast(enlaceFamilia()); } return; }
  if(a==='fam-salir'){ hojaFamilia(`<h3>¿Salir de la compra familiar?</h3><p class="small muted" style="margin:0">Te quedas con una copia del menú y la lista, pero dejarás de ver los cambios de tu familia.</p>
      <button class="btn block xl" data-act="fam-salir-ok">Salir</button><button class="btn ghost block" data-act="cerrar">Cancelar</button>`); return; }
  if(a==='fam-salir-ok'){ fam=null; guardarFam(); document.getElementById('layer').innerHTML=''; render(); toast('Has salido de la compra familiar'); return; }
}
// Invitación abierta desde un enlace (…?familia=CODIGO)
(function(){ try{
  const q=new URLSearchParams(location.search), c=limpiaCodigo(q.get('familia'));
  if(!c) return;
  history.replaceState(null,'',location.pathname+location.hash);
  if(!familiaDisponible()){ setTimeout(()=>toast('La compra familiar aún no está activada'),400); return; }
  if(fam&&fam.codigo===c){ setTimeout(()=>toast('Ya estás en esta compra familiar'),400); return; }
  window.__invitacion=c;
}catch(e){} })();

document.body.insertAdjacentHTML('afterbegin',DEFS_PLATOS);
diaSel=diaInicial();
aprovechar();
render();
if(window.__invitacion) hojaInvitacion(window.__invitacion); else if(state.nuevo) pintarBienvenida();
if(fam) consultar();
if(state.modoSuper&&tab==='lista') pedirPantalla();
</script>

</body>
</html>
